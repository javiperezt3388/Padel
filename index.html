<style>
  :root{
    --papel:#FFFFFF;
    --panel:#F4F5F3;
    --panel-alto:#E9F0F0;
    --linea:#E1E4E0;
    --tinta:#14181A;
    --gris:#5C686D;
    --sangre:#A62029;
    --pista:#17505F;
    --display:'Oswald','Arial Narrow',system-ui,sans-serif;
    --texto:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--papel)}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--texto);
       min-height:100vh;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  .app{max-width:560px;margin:0 auto;padding:0 16px 56px;background:var(--papel);min-height:100vh}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  input,textarea{font-family:inherit;font-size:16px;color:var(--tinta)}

  /* cabecera */
  header{display:flex;align-items:center;gap:12px;padding:20px 0 16px}
  .escudo{width:38px;height:44px;flex:none}
  img.escudo{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--linea)}
  .marca{font-family:var(--display);font-weight:600;font-size:23px;line-height:1;color:var(--tinta)}
  .sub{color:var(--gris);font-size:12.5px;margin-top:3px}

  /* pestañas */
  nav{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin-bottom:18px}
  nav button{background:none;border:0;padding:10px 2px;flex:1;font-family:var(--display);
             font-size:14.5px;font-weight:400;color:var(--gris);border-bottom:2px solid transparent;
             margin-bottom:-1px;transition:color .15s}
  nav button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--sangre)}
  nav button:focus-visible,.btn:focus-visible,.paso:focus-visible,input:focus-visible{
             outline:2px solid var(--pista);outline-offset:2px}

  h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 4px;color:var(--tinta)}
  .nota{color:var(--gris);font-size:13px;margin:0 0 16px}
  .vacio{border:1px dashed var(--linea);border-radius:4px;padding:24px 18px;text-align:center;color:var(--gris)}

  /* botones */
  .btn{width:100%;border:0;border-radius:4px;background:var(--sangre);color:#fff;
       font-family:var(--display);font-size:16px;font-weight:500;padding:13px;margin-top:16px}
  .btn[disabled]{background:var(--panel);color:var(--gris);cursor:not-allowed}
  .btn.hueco{background:none;border:1px solid var(--linea);color:var(--tinta);font-size:14px;padding:10px}

  /* lista de convocatoria */
  .fila{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:4px;
        background:var(--panel);margin-bottom:5px;border-left:3px solid transparent}
  .fila.dentro{border-left-color:var(--pista);background:var(--panel-alto)}
  .fila .nom{font-family:var(--display);font-size:16px;flex:1;min-width:0;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fila .espera{color:var(--gris);font-size:12px;flex:none}
  .marca-check{width:19px;height:19px;border:1px solid #B9C2C4;border-radius:3px;flex:none;
               background:var(--papel);display:grid;place-items:center;font-size:12px;color:transparent}
  .fila.dentro .marca-check{background:var(--pista);border-color:var(--pista);color:#fff}
  .contador{font-family:var(--display);font-size:13px;color:var(--gris);margin:0 0 10px}

  /* sets */
  .set{border-top:1px solid var(--linea);padding:14px 0}
  .set:first-of-type{border-top:0}
  .set-cab{font-family:var(--display);font-size:13px;color:var(--gris);margin-bottom:9px}
  .marcador{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:8px}
  .pareja{font-family:var(--display);font-size:15.5px;line-height:1.25}
  .paso-grupo{display:flex;align-items:center;gap:4px}
  .paso{width:34px;height:34px;border:1px solid var(--linea);background:var(--papel);border-radius:3px;
        font-size:17px;line-height:1;display:grid;place-items:center;color:var(--gris)}
  .juegos{font-family:var(--display);font-size:21px;width:28px;text-align:center;
          font-variant-numeric:tabular-nums}
  .gana .juegos{color:var(--sangre)}

  /* clasificación */
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-family:var(--display);font-weight:400;font-size:11.5px;color:var(--gris);
     text-align:right;padding:0 0 7px;border-bottom:1px solid var(--linea)}
  th:nth-child(2){text-align:left}
  td{padding:11px 0;border-bottom:1px solid var(--linea);text-align:right;font-size:14px;color:var(--tinta)}
  td:nth-child(2){text-align:left;font-family:var(--display);font-size:16px}
  .pos{width:26px;color:var(--gris);font-family:var(--display);font-size:14px;text-align:left}
  .media{font-family:var(--display);font-size:18px;width:52px}
  .lider td{color:var(--sangre)}
  .lider .pos{color:var(--sangre)}
  .fuera td{color:var(--gris)}
  .titulillo{font-family:var(--display);font-size:13px;color:var(--gris);margin:22px 0 8px}

  /* historial */
  .jornada{background:var(--panel);border-radius:4px;padding:13px 14px;margin-bottom:8px}
  .jornada .fecha{font-family:var(--display);font-size:13px;color:var(--gris);
                  display:flex;justify-content:space-between;align-items:center}
  .jornada .res{font-family:var(--display);font-size:15px;margin-top:7px;line-height:1.5}
  .jornada .res span{color:var(--pista);font-variant-numeric:tabular-nums}
  .borrar{background:none;border:0;color:var(--gris);font-size:12px;padding:2px 0;text-decoration:underline}

  /* grupo */
  .campo{width:100%;background:var(--papel);border:1px solid var(--linea);border-radius:4px;
         padding:11px 12px;margin-bottom:8px}
  textarea.campo{min-height:120px;resize:vertical}
  .icono-fila{display:flex;align-items:center;gap:12px;margin:10px 0 6px}
  .icono-fila img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;
                  border:1px solid var(--linea)}
  .archivo{flex:1;min-width:0;font-size:13px;color:var(--gris)}
  .archivo::file-selector-button{font-family:var(--display);font-size:14px;color:var(--tinta);
       background:var(--panel);border:1px solid var(--linea);border-radius:4px;padding:9px 12px;
       margin-right:10px}
  .banner.info{background:#F1F5F6;border-color:#D7E0E2;color:var(--tinta)}
  .banner{background:#FDF3F3;border:1px solid #EECFCF;color:#7C1D22;border-radius:4px;
          padding:10px 12px;font-size:12.5px;line-height:1.45;margin-bottom:16px}
  .aviso{color:var(--gris);font-size:12.5px;margin-top:22px;padding-top:14px;border-top:1px solid var(--linea)}
  .oculto{display:none}
</style>

<div class="app">
  <header>
    <div id="escudo"></div>
    <div>
      <div class="marca" id="marca">Deportistas Espartanos</div>
      <div class="sub">Liga de pádel · puntuación individual</div>
    </div>
  </header>

  <nav role="tablist">
    <button role="tab" data-tab="semana" aria-selected="true">Nuevo partido</button>
    <button role="tab" data-tab="clasi" aria-selected="false">Clasificación</button>
    <button role="tab" data-tab="hist" aria-selected="false">Historial</button>
    <button role="tab" data-tab="grupo" aria-selected="false">Grupo</button>
  </nav>

  <div id="aviso"></div>
  <main id="vista">Cargando…</main>
</div>

<script>
const K = 'espartanos:liga';
let S = {jugadores:[], jornadas:[]};
let tab = 'semana';
let sel = [];          // ids elegidos para esta semana
let sets = [[6,4],[6,4],[6,4]];
let fase = 'convocar';  // convocar | marcador
const hoy = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                    return d.toISOString().slice(0,10); };
let fechaPartido = hoy();
let ultima = null;      // resumen del último partido guardado
let confirmando = null; // los diálogos del navegador no funcionan en el visor: confirmamos aquí
let mensaje = '';
let soyAdmin = false;
   // control sencillo entre vecinos, no es una cerradura de verdad
const pideAdmin = /(^|[#&])admin(=|$|&)/.test(location.hash + location.search);

// la clave no se guarda nunca en claro
async function cifrar(texto){
  const semilla = 'espartanos::' + texto;
  try{
    const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(semilla));
    return [...new Uint8Array(bytes)].map(b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h = 5381;
    for(let i = 0; i < semilla.length; i++) h = ((h << 5) + h + semilla.charCodeAt(i)) >>> 0;
    return 'x' + h.toString(16);
  }
}
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = t => String(t).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const PAREJAS = [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
const MIN_JORNADAS = 4;
const PALA = `<svg class="escudo" viewBox="0 0 38 44" aria-hidden="true">
  <path d="M19 2c8.5 0 14 6 14 13.5S27.5 29 19 29 5 23 5 15.5 10.5 2 19 2Z" fill="#A62029"/>
  <g fill="#FFFFFF">
    <circle cx="13" cy="10.5" r="1.7"/><circle cx="19" cy="9.5" r="1.7"/><circle cx="25" cy="10.5" r="1.7"/>
    <circle cx="11.5" cy="16.5" r="1.7"/><circle cx="19" cy="15.5" r="1.7"/><circle cx="26.5" cy="16.5" r="1.7"/>
    <circle cx="13" cy="22.5" r="1.7"/><circle cx="19" cy="21.5" r="1.7"/><circle cx="25" cy="22.5" r="1.7"/>
  </g>
  <path d="M16.6 28h4.8v5h-4.8Z" fill="#A62029"/>
  <rect x="15.6" y="32" width="6.8" height="11" rx="2.4" fill="#17505F"/>
</svg>`;

// recorta la foto en cuadrado y la reduce, para que quepa en el almacenamiento
function prepararFoto(file){
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onerror = () => reject(new Error('no se pudo leer el archivo'));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('formato no compatible'));
      img.onload = () => {
        const L = 256, lado = Math.min(img.width, img.height);
        const c = document.createElement('canvas');
        c.width = c.height = L;
        c.getContext('2d').drawImage(img, (img.width-lado)/2, (img.height-lado)/2,
                                     lado, lado, 0, 0, L, L);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  });
}

/* ---------- datos ---------- */
let modo = 'memoria';                 // nube | local | memoria
const hayNube = () => !!(window.storage && typeof window.storage.set === 'function');
const porFecha = (a,b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0;

let diag = null;                      // resultado de la prueba de guardado

// servidor común: se coge del enlace (#db=...) y queda recordado en el móvil
let servidor = (() => {
  const m = (location.hash + location.search).match(/[#&?]db=([^&#]+)/);
  if(m){
    const u = decodeURIComponent(m[1]);
    try{ localStorage.setItem('espartanos:db', u); }catch(e){}
    return u;
  }
  try{ return localStorage.getItem('espartanos:db') || ''; }catch(e){ return ''; }
})();
const urlLiga = () => /firebaseio|firebasedatabase/.test(servidor)
  ? servidor.replace(/\/+$/, '') + '/liga.json'
  : servidor.replace(/\/+$/, '');

// crea un almacén común sin registrarse; se prueban dos servicios por si uno falla
async function crearJsonblob(){
  const r = await fetch('https://jsonblob.com/api/jsonBlob', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(S)});
  if(!r.ok) throw new Error('jsonblob responde ' + r.status);
  const id = r.headers.get('x-jsonblob');
  const sitio = r.headers.get('location');
  if(id) return 'https://jsonblob.com/api/jsonBlob/' + id;
  if(sitio) return sitio.startsWith('http') ? sitio : 'https://jsonblob.com' + sitio;
  throw new Error('jsonblob no deja leer la dirección');
}
async function crearKvdb(){
  const r = await fetch('https://kvdb.io/', {method:'POST', body:''});
  if(!r.ok) throw new Error('kvdb responde ' + r.status);
  const cubo = (await r.text()).trim();
  if(!cubo || /\s/.test(cubo)) throw new Error('kvdb no ha devuelto una dirección');
  return 'https://kvdb.io/' + cubo + '/liga';
}
async function crearServidor(){
  const fallos = [];
  for(const intento of [crearJsonblob, crearKvdb]){
    try{
      const url = await intento();
      const previo = servidor;
      servidor = url;
      if(await escribirServidor() && await leerServidor()) return url;   // comprobado de verdad
      servidor = previo;
      fallos.push('no se puede escribir en ' + url.split('/')[2]);
    }catch(e){ fallos.push(e.message); }
  }
  throw new Error(fallos.join('; '));
}
const enlaceGrupo = () => location.href.split('#')[0] + '#db=' + servidor;
const enlaceAdmin = () => enlaceGrupo() + '&admin';

async function leerServidor(){
  if(!servidor) return null;
  try{
    const r = await fetch(urlLiga());
    if(!r.ok) return null;
    const bruto = (await r.text()).trim();
    if(!bruto || bruto === 'null') return null;
    const v = JSON.parse(bruto);
    return v && v.jugadores ? v : null;
  }catch(e){ return null; }
}
async function escribirServidor(){
  if(!servidor) return false;
  try{
    const r = await fetch(urlLiga(), {method:'PUT', headers:{'Content-Type':'application/json'},
                                      body: JSON.stringify(S)});
    return r.ok;
  }catch(e){ return false; }
}

async function leerNube(){
  if(!hayNube()) return null;
  try{
    const r = await window.storage.get(K, true);
    return r && r.value ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
function leerAqui(almacen){
  try{
    const v = window[almacen].getItem(K);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
function pruebaAlmacen(almacen){
  try{
    almacen.setItem('__prueba__', '1');
    const vale = almacen.getItem('__prueba__') === '1';
    almacen.removeItem('__prueba__');
    return vale;
  }catch(e){ return false; }
}
function diagnostico(){
  let local = false, sesion = false;
  try{ local = pruebaAlmacen(window.localStorage); }catch(e){}
  try{ sesion = pruebaAlmacen(window.sessionStorage); }catch(e){}
  return {servidor: !!servidor, nube: hayNube(), local, sesion, modo, informe};
}

let informe = {servidor:null, nube:null, local:null, sesion:null};

// lee las tres copias y se queda con la más reciente
async function cargar(){
  const fuentes = {servidor: await leerServidor(),
                   nube: await leerNube(),
                   local: leerAqui('localStorage'),
                   sesion: leerAqui('sessionStorage')};
  let mejor = null;
  for(const clave of ['servidor','nube','local','sesion']){
    const v = fuentes[clave];
    informe[clave] = v ? (v.jornadas || []).length : null;
    if(v && (!mejor || (v.actualizado || 0) > (mejor.actualizado || 0))) mejor = v;
  }
  if(mejor) S = mejor;
  modo = hayNube() ? 'nube'
       : pruebaAlmacen(window.localStorage) ? 'local'
       : pruebaAlmacen(window.sessionStorage) ? 'sesion' : 'memoria';
  if(!S.jugadores) S.jugadores = [];
  if(!S.jornadas) S.jornadas = [];
  if(!S.borrados) S.borrados = [];
  const cerrado = !!(S.claveHash || S.clave);
  try{
    soyAdmin = !cerrado || localStorage.getItem('espartanos:clave') === (S.claveHash || S.clave);
  }catch(e){ soyAdmin = !cerrado; }
}

// lo que otro del grupo haya guardado mientras tanto, sin resucitar lo borrado
function fusionar(remoto){
  const fuera = new Set(S.borrados || []);
  const idsJ = new Set(S.jugadores.map(p => p.id));
  (remoto.jugadores || []).forEach(p => { if(!idsJ.has(p.id) && !fuera.has(p.id)) S.jugadores.push(p); });
  const idsP = new Set(S.jornadas.map(j => j.id));
  (remoto.jornadas || []).forEach(j => { if(!idsP.has(j.id) && !fuera.has(j.id)) S.jornadas.push(j); });
  (remoto.borrados || []).forEach(id => { if(!fuera.has(id)) S.borrados.push(id); });
  S.jugadores = S.jugadores.filter(p => !new Set(S.borrados).has(p.id));
  S.jornadas = S.jornadas.filter(j => !new Set(S.borrados).has(j.id));
}

// guarda en los tres sitios a la vez: si uno se vacía, los otros lo sostienen
async function guardar(){
  S.jornadas.sort(porFecha);
  S.actualizado = Date.now();
  let algo = false;
  if(servidor){
    const remoto = await leerServidor();
    if(remoto) fusionar(remoto);
    S.actualizado = Date.now();
    if(await escribirServidor()){ algo = true; modo = 'servidor'; informe.servidor = S.jornadas.length; }
  }
  if(hayNube()){
    try{
      const remoto = await leerNube();
      if(remoto) fusionar(remoto);
    }catch(e){}
    S.actualizado = Date.now();
    try{
      const r = await window.storage.set(K, JSON.stringify(S), true);
      if(r){ algo = true; if(modo !== 'servidor') modo = 'nube'; informe.nube = S.jornadas.length; }
    }catch(e){}
  }
  const texto = JSON.stringify(S);
  for(const [clave, almacen] of [['local','localStorage'], ['sesion','sessionStorage']]){
    try{
      window[almacen].setItem(K, texto);
      informe[clave] = S.jornadas.length;
      if(!algo) modo = clave;
      algo = true;
    }catch(e){ informe[clave] = null; }
  }
  if(!algo) modo = 'memoria';
  return algo;
}

/* ---------- cálculo ---------- */
function puntosJornada(j){
  const p = {};
  j.jugadores.forEach(id => p[id] = {puntos:0, sets:0});
  j.sets.forEach((marcador, i) => {
    PAREJAS[i].forEach((pareja, lado) => {
      const juegos = marcador[lado], rival = marcador[1-lado];
      pareja.forEach(k => {
        const id = j.jugadores[k];
        if(!p[id]) return;
        p[id].puntos += juegos + (juegos > rival ? 1 : 0);
        if(juegos > rival) p[id].sets += 1;
      });
    });
  });
  return p;
}
function tabla(){
  const t = {};
  S.jugadores.forEach(p => t[p.id] = {id:p.id, nombre:p.nombre, jornadas:0, puntos:0, sets:0, ultima:-1});
  S.jornadas.forEach((j, idx) => {
    const p = puntosJornada(j);
    Object.keys(p).forEach(id => {
      if(!t[id]) return;
      t[id].jornadas++; t[id].puntos += p[id].puntos; t[id].sets += p[id].sets; t[id].ultima = idx;
    });
  });
  return Object.values(t).map(x => ({...x, media: x.jornadas ? x.puntos / x.jornadas : 0}));
}
function turno(){ // a quién le toca: más semanas sin jugar primero
  const total = S.jornadas.length;
  return tabla().map(x => ({...x, espera: x.ultima < 0 ? 999 : total - 1 - x.ultima}))
    .sort((a,b) => b.espera - a.espera || a.jornadas - b.jornadas || a.nombre.localeCompare(b.nombre));
}

/* ---------- pintar ---------- */
function pintar(){
  const puedeGrupo = soyAdmin || pideAdmin;
  const botonGrupo = document.querySelector('nav button[data-tab="grupo"]');
  if(botonGrupo) botonGrupo.style.display = puedeGrupo ? '' : 'none';
  if(tab === 'grupo' && !puedeGrupo) tab = 'semana';
  $('#marca').textContent = S.nombre || 'Deportistas Espartanos';
  $('#aviso').innerHTML =
    (modo === 'memoria' ? `<div class="banner">Este visor no está dejando guardar nada, así que los cambios se perderán al cerrar.
       Descarga el archivo y ábrelo desde tu móvil, o copia tus datos en Grupo antes de salir.</div>` : '') +
    (mensaje ? `<div class="banner info">${mensaje}</div>` : '');
  $('#escudo').innerHTML = S.icono
    ? `<img class="escudo" src="${S.icono}" alt="Icono del grupo">` : PALA;
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('#vista').innerHTML = ({semana:vSemana, clasi:vClasi, hist:vHist, grupo:vGrupo})[tab]();
}

function vSemana(){
  if(!S.jugadores.length)
    return `<div class="vacio">Aún no hay jugadores.<br>Añádelos en la pestaña Grupo y aquí aparecerá a quién le toca.</div>`;

  if(fase === 'marcador'){
    const n = i => esc(S.jugadores.find(p => p.id === sel[i]).nombre);
    const bloques = PAREJAS.map((pj, i) => {
      const [a, b] = sets[i];
      return `<div class="set">
        <div class="set-cab">Set ${i+1}</div>
        ${[0,1].map(lado => `
          <div class="marcador ${sets[i][lado] > sets[i][1-lado] ? 'gana':''}">
            <div class="pareja">${n(pj[lado][0])} <span style="color:var(--gris)">y</span> ${n(pj[lado][1])}</div>
            <div class="paso-grupo">
              <button class="paso" data-set="${i}" data-lado="${lado}" data-d="-1" aria-label="Quitar juego">−</button>
              <span class="juegos">${sets[i][lado]}</span>
              <button class="paso" data-set="${i}" data-lado="${lado}" data-d="1" aria-label="Sumar juego">+</button>
            </div>
          </div>`).join('')}
      </div>`;
    }).join('');
    return `<h2>Resultado del partido</h2>
      <p class="nota">Cambiáis de pareja en cada set, así que cada uno juega con los otros tres. Un punto por juego y otro por set ganado.</p>
      <div class="titulillo" style="margin-top:0">Día del partido</div>
      <input class="campo" type="date" id="fechaPartido" value="${fechaPartido}">
      ${bloques}
      <button class="btn" id="guardar">Guardar partido</button>
      <button class="btn hueco" id="atras">Volver a la convocatoria</button>`;
  }

  const orden = turno();
  if(!sel.length) sel = orden.slice(0,4).map(x => x.id);
  const filas = orden.map(x => {
    const dentro = sel.includes(x.id);
    const espera = x.ultima < 0 ? 'sin estrenar'
      : x.espera === 0 ? 'jugó el último' : `${x.espera} ${x.espera === 1 ? 'partido':'partidos'} sin jugar`;
    return `<div class="fila ${dentro?'dentro':''}" data-id="${x.id}">
      <span class="marca-check">✓</span>
      <span class="nom">${esc(x.nombre)}</span>
      <span class="espera">${espera}</span>
    </div>`;
  }).join('');

  const resumen = ultima ? `<div class="jornada" style="margin-bottom:18px">
      <div class="fecha">Partido guardado</div>
      <div class="res">${ultima}</div></div>` : '';

  return `${resumen}<h2>A quién le toca</h2>
    <p class="nota">Ordenados por quién lleva más tiempo sin jugar. Los cuatro de arriba entran solos; toca cualquier nombre para cambiarlo. Si un día jugáis dos partidos, guarda el primero y vuelve aquí a montar el siguiente.</p>
    <p class="contador">${sel.length} de 4 elegidos</p>
    ${filas}
    <button class="btn" id="alMarcador" ${sel.length !== 4 ? 'disabled':''}>Anotar resultado</button>`;
}

function vClasi(){
  if(S.jornadas.length === 0)
    return `<div class="vacio">Todavía no hay partidos.<br>Cuando guardéis el primero, la clasificación se hace sola.</div>`;
  const t = tabla().filter(x => x.jornadas > 0)
    .sort((a,b) => b.media - a.media || b.jornadas - a.jornadas || b.sets - a.sets);
  const dentro = t.filter(x => x.jornadas >= MIN_JORNADAS);
  const fuera = t.filter(x => x.jornadas < MIN_JORNADAS);
  const fila = (x, i, off) => `<tr class="${off ? 'fuera' : (i === 0 ? 'lider':'')}">
      <td class="pos">${off ? '–' : i+1}</td>
      <td>${esc(x.nombre)}</td>
      <td class="media">${x.media.toFixed(1)}</td>
      <td>${x.jornadas}</td>
      <td>${x.sets}</td>
    </tr>`;
  const cab = `<tr><th class="pos"></th><th>Jugador</th><th>Media</th><th>Part.</th><th>Sets</th></tr>`;
  return `<h2>Clasificación</h2>
    <p class="nota">Media de puntos por partido jugado, para que quien juegue menos no quede descolgado. Hacen falta ${MIN_JORNADAS} partidos para entrar.</p>
    ${dentro.length ? `<table><thead>${cab}</thead><tbody>${dentro.map((x,i)=>fila(x,i,false)).join('')}</tbody></table>`
      : `<div class="vacio">Nadie llega aún a ${MIN_JORNADAS} partidos.</div>`}
    ${fuera.length ? `<div class="titulillo">Les faltan partidos para clasificar</div>
      <table><tbody>${fuera.map(x=>fila(x,0,true)).join('')}</tbody></table>` : ''}`;
}

function vHist(){
  if(!S.jornadas.length)
    return `<div class="vacio">Aquí se irán guardando los partidos.</div>`;
  const items = [...S.jornadas].reverse().map(j => {
    const p = puntosJornada(j);
    const n = i => esc((S.jugadores.find(q => q.id === j.jugadores[i]) || {nombre:'?'}).nombre);
    const linea = (i) => `Set ${i+1}: ${n(PAREJAS[i][0][0])}·${n(PAREJAS[i][0][1])} <span>${j.sets[i][0]}–${j.sets[i][1]}</span> ${n(PAREJAS[i][1][0])}·${n(PAREJAS[i][1][1])}`;
    const puntos = j.jugadores.map(id => `${esc((S.jugadores.find(q=>q.id===id)||{nombre:'?'}).nombre)} <span>${p[id].puntos}</span>`).join(' · ');
    const f = new Date(j.fecha + 'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long'});
    return `<div class="jornada">
      <div class="fecha"><span>${f}</span>${!soyAdmin ? '' : confirmando === 'partido:'+j.id
        ? `¿Seguro? <button class="borrar" data-si="partido:${j.id}">Sí, borrar</button> ·
           <button class="borrar" data-no="1">No</button>`
        : `<button class="borrar" data-pedir="partido:${j.id}">Borrar</button>`}</div>
      <div class="res">${[0,1,2].map(linea).join('<br>')}</div>
      <div class="res" style="color:var(--gris);font-size:13.5px">${puntos}</div>
    </div>`;
  }).join('');
  return `<h2>Historial</h2><p class="nota">${S.jornadas.length} ${S.jornadas.length===1?'partido jugado':'partidos jugados'}.</p>${items}`;
}

/* ---------- interacción ---------- */
document.addEventListener('click', async e => {
  const t = e.target;

  const nav = t.closest('nav button');
  if(nav){ tab = nav.dataset.tab; ultima = null; confirmando = null; mensaje = ''; pintar(); return; }

  const fila = t.closest('.fila[data-id]');
  if(fila){
    const id = fila.dataset.id;
    if(sel.includes(id)) sel = sel.filter(x => x !== id);
    else if(sel.length < 4) sel.push(id);
    else { mensaje = 'Ya hay cuatro. Quita a alguien antes de meter a otro.'; pintar(); return; }
    pintar(); return;
  }

  if(t.id === 'alMarcador'){ fase = 'marcador'; sets = [[6,4],[6,4],[6,4]]; fechaPartido = hoy(); pintar(); return; }
  if(t.id === 'atras'){ fase = 'convocar'; pintar(); return; }

  const paso = t.closest('.paso');
  if(paso){
    const i = +paso.dataset.set, lado = +paso.dataset.lado;
    sets[i][lado] = Math.max(0, Math.min(9, sets[i][lado] + (+paso.dataset.d)));
    pintar(); return;
  }

  if(t.id === 'guardar'){
    if(sets.some(s => s[0] === s[1])){
      mensaje = 'Algún set está empatado. Ajusta el marcador antes de guardar.'; pintar(); return;
    }
    const j = {id:uid(), fecha:fechaPartido || hoy(),
               jugadores:[...sel], sets:sets.map(s => [...s])};
    S.jornadas.push(j);
    const p = puntosJornada(j);
    ultima = j.jugadores.map(id => `${esc(S.jugadores.find(q=>q.id===id).nombre)} <span>${p[id].puntos}</span>`).join(' · ');
    fase = 'convocar'; sel = [];
    await guardar(); pintar();
    return;
  }

  if(t.id === 'añadir'){
    const nombres = $('#nuevos').value.split('\n').map(s => s.trim()).filter(Boolean);
    if(!nombres.length){ $('#nuevos').focus(); return; }
    nombres.forEach(n => S.jugadores.push({id:uid(), nombre:n}));
    sel = [];
    await guardar(); pintar();
    return;
  }

  const soloAdmin = ['añadir','restaurar','quitaFoto'].includes(t.id) ||
                    (t.dataset.pedir || t.dataset.si || '').match(/^(jugador|partido|reset)/);
  if(soloAdmin && !soyAdmin){
    mensaje = 'Eso solo lo puede cambiar el administrador del grupo.';
    pintar(); return;
  }

  const pedir = t.dataset.pedir;
  if(pedir){
    confirmando = pedir;
    const [tipo, id] = pedir.split(':');
    mensaje = (tipo === 'jugador' && S.jornadas.some(j => j.jugadores.includes(id)))
      ? 'Ese jugador ya ha jugado partidos: si lo quitas, sus puntos salen de la clasificación.' : '';
    pintar(); return;
  }
  if(t.dataset.no){ confirmando = null; mensaje = ''; pintar(); return; }

  const si = t.dataset.si;
  if(si){
    const [tipo, id] = si.split(':');
    if(tipo === 'jugador'){
      S.jugadores = S.jugadores.filter(p => p.id !== id);
      S.borrados.push(id);
      sel = sel.filter(x => x !== id);
    } else if(tipo === 'partido'){
      S.jornadas = S.jornadas.filter(j => j.id !== id);
      S.borrados.push(id);
    } else if(tipo === 'reset'){
      S.jornadas.forEach(j => S.borrados.push(j.id));
      S.jornadas = [];
      sel = [];
    }
    confirmando = null; mensaje = '';
    await guardar(); pintar();
    return;
  }

  if(t.id === 'quitaFoto'){
    delete S.icono;
    await guardar(); pintar(); return;
  }

  if(t.id === 'entrarAdmin'){
    const dada = ($('#clave').value || '').trim();
    const huella = await cifrar(dada);
    const vale = S.claveHash ? huella === S.claveHash : (!!S.clave && dada === S.clave);
    if(vale){
      if(!S.claveHash){ S.claveHash = huella; delete S.clave; await guardar(); }
      try{ localStorage.setItem('espartanos:clave', S.claveHash); }catch(e){}
      soyAdmin = true; mensaje = 'Modo administrador activado.';
    } else mensaje = 'Ese código no es el del grupo.';
    pintar(); return;
  }

  if(t.id === 'ponerClave'){
    const nueva = ($('#clave').value || '').trim();
    if(nueva.length < 4){ mensaje = 'Pon un código de al menos cuatro caracteres.'; pintar(); return; }
    S.claveHash = await cifrar(nueva);
    delete S.clave;
    try{ localStorage.setItem('espartanos:clave', S.claveHash); }catch(e){}
    soyAdmin = true; mensaje = 'Código guardado. Apúntalo, no se puede recuperar.';
    await guardar(); pintar(); return;
  }

  if(t.id === 'salirAdmin'){
    try{ localStorage.removeItem('espartanos:clave'); }catch(e){}
    soyAdmin = false; mensaje = 'Ya ves la app como el resto del grupo.';
    pintar(); return;
  }

  if(t.id === 'crearServidor'){
    mensaje = 'Creando el servidor…'; pintar();
    try{
      servidor = await crearServidor();
      try{ localStorage.setItem('espartanos:db', servidor); }catch(e){}
      await guardar();
      mensaje = 'Servidor creado. Copia el enlace y pásalo al grupo.';
    }catch(err){
      servidor = '';
      mensaje = 'No he podido crearlo: ' + err.message + '. Entra en jsonblob.com desde el navegador, ' +
                'guarda ahí un {} y pega la dirección de la API en el recuadro de abajo.';
    }
    pintar(); return;
  }

  if(t.id === 'copiarEnlace' || t.id === 'copiarAdmin'){
    const caja = $(t.id === 'copiarAdmin' ? '#enlaceAdmin' : '#enlace');
    try{
      await navigator.clipboard.writeText(caja.value);
      mensaje = 'Enlace copiado. Pégalo en el grupo de WhatsApp.';
    }catch(err){
      caja.select(); caja.setSelectionRange(0, 99999);
      mensaje = document.execCommand('copy') ? 'Enlace copiado.' : 'Cópialo a mano desde el recuadro.';
    }
    pintar(); return;
  }

  if(t.id === 'quitarServidor'){
    servidor = '';
    try{ localStorage.removeItem('espartanos:db'); }catch(e){}
    informe.servidor = null;
    mensaje = 'Desconectado. Los datos siguen guardados en este móvil.';
    pintar(); return;
  }

  if(t.id === 'ponerServidor'){
    servidor = ($('#servidor').value || '').trim().replace(/\/+$/, '');
    try{ servidor ? localStorage.setItem('espartanos:db', servidor)
                  : localStorage.removeItem('espartanos:db'); }catch(e){}
    if(servidor) await guardar();
    mensaje = !servidor ? 'No has puesto ninguna dirección.'
      : informe.servidor !== null ? 'Conectado. Copia el enlace y pásalo al grupo.'
      : 'No he podido escribir en esa dirección. Revísala y comprueba que permite escritura.';
    pintar(); return;
  }

  if(t.id === 'copiar'){
    const caja = $('#copia');
    try{
      await navigator.clipboard.writeText(caja.value);
      mensaje = 'Datos copiados. Pégalos donde quieras guardarlos.';
    }catch(err){
      caja.select(); caja.setSelectionRange(0, 99999);
      mensaje = document.execCommand('copy')
        ? 'Datos copiados. Pégalos donde quieras guardarlos.'
        : 'No he podido copiar solo: mantén pulsado el texto y cópialo a mano.';
    }
    pintar(); return;
  }

  if(t.id === 'restaurar'){
    let datos;
    try{ datos = JSON.parse($('#copia').value); }
    catch(err){ mensaje = 'Ese texto no es una copia válida.'; pintar(); return; }
    if(!datos || !Array.isArray(datos.jugadores)){ mensaje = 'Ese texto no es una copia válida.'; pintar(); return; }
    const icono = S.icono, huella = S.claveHash || S.clave;
    S = datos;
    if(huella && !S.claveHash){ S.claveHash = huella; delete S.clave; }
    if(!S.jornadas) S.jornadas = [];
    if(!S.borrados) S.borrados = [];
    if(icono && !S.icono) S.icono = icono;
    sel = []; fase = 'convocar';
    mensaje = 'Datos restaurados.';
    await guardar(); pintar();
    return;
  }

});

// alternativa por si el móvil no abre el selector de archivos
async function ponerIcono(dato){
  S.icono = dato;
  await guardar(); pintar();
}
document.addEventListener('paste', async e => {
  if(e.target.id !== 'pegar') return;
  const items = [...(e.clipboardData ? e.clipboardData.items : [])];
  const img = items.find(i => i.type.startsWith('image/'));
  if(img){
    e.preventDefault();
    try{ await ponerIcono(await prepararFoto(img.getAsFile())); }
    catch(err){ mensaje = 'Esa imagen no se ha podido usar (' + err.message + ').'; pintar(); }
  }
});
document.addEventListener('change', async e => {
  if(e.target.id === 'pegar'){
    const v = e.target.value.trim();
    if(/^https?:\/\//i.test(v)) await ponerIcono(v);
    else if(v){ mensaje = 'Pega una foto copiada o un enlace que empiece por https.'; pintar(); }
    return;
  }
  if(e.target.id === 'fechaPartido'){ fechaPartido = e.target.value || hoy(); return; }
  if(['nombreGrupo','foto'].includes(e.target.id) && !soyAdmin){
    mensaje = 'Eso solo lo puede cambiar el administrador del grupo.'; pintar(); return;
  }
  if(e.target.id === 'nombreGrupo'){
    const n = e.target.value.trim();
    S.nombre = n || 'Deportistas Espartanos';
    await guardar(); pintar(); return;
  }
  if(e.target.id !== 'foto') return;
  const file = e.target.files && e.target.files[0];
  e.target.value = '';           // permite volver a elegir la misma foto
  if(!file) return;
  const previa = S.icono;
  try{
    S.icono = await prepararFoto(file);
  }catch(err){
    mensaje = 'Esa foto no se ha podido usar (' + err.message + '). Prueba con otra del carrete o con una captura de pantalla.';
    pintar(); return;
  }
  if(!await guardar()){ if(previa) S.icono = previa; else delete S.icono; }
  pintar();
});

// fallback: pegar la foto copiada desde la galería, o un enlace de imagen
document.addEventListener('paste', async e => {
  if(e.target.id !== 'pegar') return;
  const datos = e.clipboardData;
  const img = [...(datos.items || [])].find(i => i.type.startsWith('image/'));
  if(img){
    e.preventDefault();
    try{
      S.icono = await prepararFoto(img.getAsFile());
      await guardar(); pintar();
    }catch(err){ mensaje = 'No se ha podido usar esa imagen (' + err.message + ').'; pintar(); }
    return;
  }
  const texto = (datos.getData('text') || '').trim();
  if(/^https?:\/\//.test(texto)){

    S.icono = texto;

  }
});

cargar().then(pintar);
